name: Build macOS ARM64 Release (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: Kometra
  # BUNDLE_ID rimosso, non serve qui se lo specifichi già nel .csproj
  # VERSION rimossa per renderlo generico

jobs:
  build-macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect .NET Version
        id: detect
        working-directory: ./Kometra
        shell: bash
        run: |
          TFM=$(sed -n 's/.*<TargetFramework>\(.*\)<\/TargetFramework>.*/\1/p' Kometra.csproj | tr -d '\r' | xargs)
          echo "TFM=$TFM" >> $GITHUB_ENV
          
          VER=$(echo $TFM | sed 's/[^0-9.]//g')
          echo "DOTNET_VER=$VER.x" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VER }}

      - name: Clean & Restore
        working-directory: ./Kometra
        shell: bash
        run: |
          set -e
          rm -rf bin obj
          dotnet restore Kometra.csproj

      - name: Publish macOS ARM64
        working-directory: ./Kometra
        shell: bash
        run: |
          set -e
          RID="osx-arm64"
          
          dotnet publish Kometra.csproj \
            -c Release \
            -r "${RID}" \
            --self-contained true \
            -p:SelfContained=true \
            -p:UseAppHost=true \
            -p:PublishSingleFile=false \
            -p:PublishReadyToRun=false \
            -p:TreatWarningsAsErrors=false

      - name: Check ARM64 executable & .app bundle
        shell: bash
        run: |
          set -e
          RID="osx-arm64"
          APP_DIR="Kometra/bin/Release/${TFM}/${RID}/${APP_NAME}.app"
          EXEC="${APP_DIR}/Contents/MacOS/${APP_NAME}"
          
          if [ ! -d "${APP_DIR}" ]; then
            echo "ERROR: .app bundle not found: ${APP_DIR}"
            exit 1
          fi
          
          if [ ! -f "${EXEC}" ]; then
            echo "ERROR: Native executable not found: ${EXEC}"
            exit 1
          fi
          chmod +x "${EXEC}"

      - name: Remove extended attributes and Ad-Hoc Code Sign
        shell: bash
        run: |
          set -e
          RID="osx-arm64"
          APP_DIR="Kometra/bin/Release/${TFM}/${RID}/${APP_NAME}.app"
          
          echo "Removing extended attributes"
          xattr -cr "${APP_DIR}" || true
          
          echo "Signing app with Ad-Hoc signature"
          codesign --force --deep -s - "${APP_DIR}"

      - name: Prepare Artifact
        shell: bash
        run: |
          set -e
          RID="osx-arm64"
          APP_DIR="Kometra/bin/Release/${TFM}/${RID}/${APP_NAME}.app"
          
          mkdir -p ArtifactStaging
          
          # Creiamo lo ZIP manualmente con ditto (preserva gli attributi Mac e la firma)
          echo "Compressing .app to ZIP preserving Mac attributes..."
          ditto -c -k --keepParent "${APP_DIR}" "ArtifactStaging/${APP_NAME}-macOS-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kometra-macOS-arm64
          path: ArtifactStaging/${{ env.APP_NAME }}-macOS-arm64.zip
          if-no-files-found: error